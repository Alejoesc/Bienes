<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8"><title>SGBN - Compras y Requisiciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .modal-fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 3000; animation: fadeIn 0.2s ease;}
        .modal-fullscreen-content { background: var(--bg-card); width: 90%; max-width: 850px; border-radius: 20px; padding: 35px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); border: 1px solid var(--border); animation: slideUp 0.3s ease; max-height: 90vh; overflow-y: auto;}
        .adjunto-box { border: 1px solid var(--border); padding: 15px; border-radius: 10px; background: var(--table-header); text-align: center; margin-top: 10px; }
        .adjunto-box img { max-width: 100%; max-height: 250px; border-radius: 8px; object-fit: contain; cursor: pointer; }
    </style>
</head>
<body>
<div id="toast-container" class="sgbn-toast-container"></div>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header"><div style="display:flex;align-items:center;gap:10px;"><span class="material-icons">inventory_2</span><h2 style="margin:0;font-size:20px;">SGBN</h2></div></div>
        <div class="sidebar-content">
            <div>
                <div class="user-profile"><span class="material-icons">account_circle</span><div class="user-details"><span id="user-info" class="user-name"></span><span id="user-role" class="user-role-badge"></span></div></div>
                <nav class="sidebar-nav">
                    <button onclick="window.location.href='/index.html'"><span class="material-icons">dashboard</span> Panel Gerencial</button>
                    <button onclick="window.location.href='/inventario.html'"><span class="material-icons">devices</span> Inventario</button>
                    <button onclick="window.location.href='/compras.html'" class="active"><span class="material-icons">shopping_cart</span> Compras</button>
                    <button onclick="window.location.href='/licencias.html'"><span class="material-icons">vpn_key</span> Licencias</button>
                    <button onclick="window.location.href='/contabilidad.html'" id="menu-contabilidad" class="hidden"><span class="material-icons">account_balance_wallet</span> Contabilidad</button>
                    <button onclick="window.location.href='/enajenacion.html'"><span class="material-icons">delete_sweep</span> Enajenación</button>
                    <button onclick="window.location.href='/usuarios.html'" id="menu-usuarios" class="hidden"><span class="material-icons">security</span> Usuarios</button>
                    <button onclick="window.location.href='/departamentos.html'" id="menu-departamentos" class="hidden"><span class="material-icons">business</span> Deptos</button>
                    <button onclick="window.location.href='/auditoria.html'" id="menu-auditoria" class="hidden"><span class="material-icons">policy</span> Auditoría</button>
                    <button onclick="window.location.href='/sistema.html'" id="menu-sistema" class="hidden"><span class="material-icons">settings</span> Sistema</button>
                </nav>
            </div>
            <div class="sidebar-footer"><button onclick="logout()" class="btn-danger" style="width:100%; justify-content:center;"><span class="material-icons">logout</span> Salir del Sistema</button></div>
        </div>
    </aside>
    <main class="main-content">
        <h1>Requisiciones y Flujo de Compras</h1>
        
        <div style="background:var(--bg-card); padding:20px 25px; border-radius:15px; margin-top:20px; border:1px solid var(--border);">
            <h3 style="color:var(--primary); margin-bottom:15px; margin-top:0;"><span class="material-icons" style="vertical-align:middle;">picture_as_pdf</span> Histórico y Reporte de Compras</h3>
            <div style="display:flex; gap:20px; align-items:flex-end; flex-wrap:wrap;">
                <div><label style="font-size:12px; font-weight:bold;">Desde:</label><br><input type="date" id="pdf-compra-desde" style="margin-top:5px;"></div>
                <div><label style="font-size:12px; font-weight:bold;">Hasta:</label><br><input type="date" id="pdf-compra-hasta" style="margin-top:5px;"></div>
                <button onclick="window.pdfCompras()" class="btn-primary" style="padding:10px 20px; font-size:14px; background:#10b981; height:45px;"><span class="material-icons" style="font-size:18px;">print</span> PDF Oficial</button>
                <button onclick="window.xlsCompras()" class="btn-primary" style="padding:10px 20px; font-size:14px; background:#2563eb; height:45px;"><span class="material-icons" style="font-size:18px;">table_chart</span> Reporte XLS</button>
            </div>
        </div>
        
        <div class="table-responsive mt-4">
            <table><thead><tr><th>Solicitante / Fecha</th><th>Descripción</th><th>Presupuesto</th><th>Estatus</th><th>Acciones Rápidas</th></tr></thead><tbody id="tabla-compras"></tbody></table>
        </div>
    </main>
</div>

<div id="modal-detalle-compra" class="modal-fullscreen hidden">
    <div class="modal-fullscreen-content">
        <div class="flex-between" style="border-bottom:1px solid var(--border); padding-bottom:15px; margin-bottom:20px;">
            <h2 style="color:var(--primary); margin:0; display:flex; align-items:center; gap:10px;"><span class="material-icons">assignment</span> Expediente de Requisición #<span id="exp-id"></span></h2>
            <span class="material-icons" style="cursor:pointer; font-size:28px;" onclick="document.getElementById('modal-detalle-compra').classList.add('hidden')">close</span>
        </div>
        <div id="detalle-compra-body" style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; font-size:14px; margin-bottom:25px;"></div>
        <div id="contenedor-acciones-compra" style="display:flex; justify-content:flex-end; gap:12px; border-top: 1px solid var(--border); padding-top: 20px;"></div>
    </div>
</div>

<div id="modal-rechazo" class="modal hidden" style="z-index: 4000;">
    <div class="modal-content">
        <h3 style="color:var(--danger); margin-bottom:15px;">Rechazar Requisición</h3>
        <input type="hidden" id="rechazo-compra-id">
        <textarea id="rechazo-motivo" placeholder="Motivo del rechazo..." style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border); margin-bottom:20px;" rows="4"></textarea>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button onclick="window.procesarRechazoCompra()" class="btn-danger">Confirmar</button>
            <button onclick="document.getElementById('modal-rechazo').classList.add('hidden')" class="btn-primary">Cancelar</button>
        </div>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
    let cacheComprasGlobal = [];

    document.addEventListener("DOMContentLoaded", () => { 
        document.getElementById('pdf-compra-desde').value = new Date().getFullYear() + '-01-01';
        document.getElementById('pdf-compra-hasta').value = new Date().toISOString().split('T')[0];
        window.loadCompras(); 
        const urlParams = new URLSearchParams(window.location.search);
        const openId = urlParams.get('open');
        if(openId) setTimeout(() => window.abrirDetalleCompra(Number(openId)), 500);
    });

    window.loadCompras = async function() {
        try {
            const res = await fetch('/api/compras', { headers: authHeaders() });
            cacheComprasGlobal = await res.json();
            const rol = localStorage.getItem('role');
            document.getElementById('tabla-compras').innerHTML = cacheComprasGlobal.map(c => {
                let botones = '';
                const estadoLower = c.estado.toLowerCase();
                if ((estadoLower === 'pendiente supervisor' || estadoLower === 'aprobado supervisor') && ['editor', 'admin'].includes(rol)) {
                    botones += `<button onclick="window.aprobarCompraDirecta(${c.id}); event.stopPropagation();" class="btn-primary" style="padding:6px 10px; font-size:11px; background:var(--success);">Aprobar</button>`;
                }
                if(!estadoLower.includes('rechazado') && !estadoLower.includes('aprobado') && !estadoLower.includes('completado') && ['editor', 'admin'].includes(rol)) {
                    botones += `<button onclick="window.abrirRechazo(${c.id}); event.stopPropagation();" class="btn-danger" style="padding:6px 10px; font-size:11px; margin-left:5px;">Rechazar</button>`;
                }
                const motivoRechazo = estadoLower.includes('rechazado') ? `<br><small style="color:var(--danger); font-weight:bold;">${c.estatus}</small>` : '';
                return `
                <tr style="cursor:pointer;" onclick="window.abrirDetalleCompra(${c.id})">
                    <td><strong>${c.solicitante}</strong><br><small style="color:var(--text-muted);">${c.created_at ? c.created_at.split('T')[0] : ''}</small></td>
                    <td><strong>${c.descripcion}</strong><br><small>${c.departamento}</small></td>
                    <td><strong style="color:var(--success);">$${parseFloat(c.presupuesto).toFixed(2)}</strong></td>
                    <td><span class="badge" style="background:${estadoLower.includes('aprobado') || estadoLower==='completado' ? 'var(--success)' : estadoLower.includes('rechazado') ? 'var(--danger)' : 'var(--warning)'};color:#fff;">${c.estado}</span>${motivoRechazo}</td>
                    <td onclick="event.stopPropagation()"><div style="display:flex; gap:5px;">${botones}</div></td>
                </tr>
                `;
            }).join('');
        } catch(e) {}
    };

    window.abrirDetalleCompra = function(id) {
        const c = cacheComprasGlobal.find(item => item.id === id);
        if(!c) return;
        document.getElementById('exp-id').innerText = c.id;
        let htmlAdjunto = `<div class="adjunto-box">Sin factura adjunta</div>`;
        if(c.foto_adjunta) {
            const ext = c.foto_adjunta.split('.').pop().toLowerCase();
            if(ext === 'pdf') htmlAdjunto = `<div class="adjunto-box"><a href="/uploads/${c.foto_adjunta}" target="_blank" class="btn-primary" style="background:#0284c7;">Ver PDF</a></div>`;
            else htmlAdjunto = `<div class="adjunto-box"><img src="/uploads/${c.foto_adjunta}" onclick="window.open(this.src)"></div>`;
        }
        document.getElementById('detalle-compra-body').innerHTML = `
            <div><span style="font-size:12px; color:var(--text-muted);">Solicitante:</span><br><strong>${c.solicitante}</strong></div>
            <div><span style="font-size:12px; color:var(--text-muted);">Departamento:</span><br><strong>${c.departamento}</strong></div>
            <div style="grid-column: span 2;"><span style="font-size:12px; color:var(--text-muted);">Descripción:</span><br><strong>${c.descripcion}</strong></div>
            <div><span style="font-size:12px; color:var(--text-muted);">Presupuesto:</span><br><strong style="color:var(--success);">$${parseFloat(c.presupuesto).toFixed(2)}</strong></div>
            <div style="grid-column: span 2;"><span style="font-size:12px; color:var(--text-muted);">Factura / Cotización:</span>${htmlAdjunto}</div>
        `;
        const rol = localStorage.getItem('role');
        const estadoLower = c.estado.toLowerCase();
        let botonesModal = `<button onclick="document.getElementById('modal-detalle-compra').classList.add('hidden')" class="btn-primary" style="background:var(--secondary);">Cerrar</button>`;
        if (!estadoLower.includes('aprobado') && !estadoLower.includes('completado') && !estadoLower.includes('rechazado') && ['editor', 'admin'].includes(rol)) {
            botonesModal = `<button onclick="window.abrirRechazo(${c.id})" class="btn-danger">Rechazar</button><button onclick="window.aprobarCompraDirecta(${c.id}, true)" class="btn-primary" style="background:var(--success);">Aprobar</button>${botonesModal}`;
        }
        document.getElementById('contenedor-acciones-compra').innerHTML = botonesModal;
        document.getElementById('modal-detalle-compra').classList.remove('hidden');
    };

    window.aprobarCompraDirecta = async function(id, fromModal = false) {
        if(!confirm("¿Aprobar esta requisición?")) return;
        await fetch(`/api/compras/${id}/aprobar-sup`, { method: 'PUT', headers: authHeaders() });
        const res = await fetch(`/api/compras/${id}/aprobar-compra`, { method: 'PUT', headers: authHeaders(), body: JSON.stringify({}) });
        if(res.ok) {
            mostrarNotificacion("Compra aprobada.", "success");
            if(fromModal) document.getElementById('modal-detalle-compra').classList.add('hidden');
            window.loadCompras();
        }
    };

    window.abrirRechazo = id => { document.getElementById('rechazo-compra-id').value = id; document.getElementById('modal-rechazo').classList.remove('hidden'); };
    window.procesarRechazoCompra = async () => {
        const id = document.getElementById('rechazo-compra-id').value; const motivo = document.getElementById('rechazo-motivo').value;
        await fetch(`/api/compras/${id}/rechazar`, { method: 'PUT', headers: authHeaders(), body: JSON.stringify({ motivo }) });
        document.getElementById('modal-rechazo').classList.add('hidden'); document.getElementById('modal-detalle-compra').classList.add('hidden'); window.loadCompras(); mostrarNotificacion("Rechazado", "error");
    };

    window.pdfCompras = function() {
        const fdStr = document.getElementById('pdf-compra-desde').value; const fhStr = document.getElementById('pdf-compra-hasta').value;
        const filtrados = cacheComprasGlobal.filter(c => !c.created_at || (c.created_at.split('T')[0] >= fdStr && c.created_at.split('T')[0] <= fhStr));
        if(filtrados.length === 0) return mostrarNotificacion("No hay registros.", "warning");
        const win = window.open('', '_blank');
        const filas = filtrados.map(c => `<tr><td>#${c.id}</td><td>${c.solicitante}</td><td>${c.descripcion}</td><td>$${parseFloat(c.presupuesto).toFixed(2)}</td><td><b>${c.estado}</b></td></tr>`).join('');
        win.document.write(`<html><head><title>Histórico</title><style>body{font-family:sans-serif;margin:30px;font-size:12px;} table{width:100%;border-collapse:collapse;} th,td{border:1px solid #ddd;padding:8px;text-align:left;} th{background:#10b981;color:#fff;}</style></head><body><h2>Histórico de Requisiciones</h2><table><tr><th>ID</th><th>Solicitante</th><th>Descripción</th><th>Monto</th><th>Estado</th></tr>${filas}</table><script>window.onload=()=>window.print();<\/script></body></html>`);
        win.document.close();
    };

    window.xlsCompras = function() {
        if(cacheComprasGlobal.length === 0) return mostrarNotificacion("No hay registros", "warning");
        const filas = cacheComprasGlobal.map(c => `<tr><td>#${c.id}</td><td>${c.solicitante}</td><td>${c.descripcion}</td><td>${c.presupuesto}</td><td>${c.estado}</td></tr>`).join('');
        const html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><table border="1"><tr><th>ID</th><th>Solicitante</th><th>Descripción</th><th>Monto</th><th>Estado</th></tr>${filas}</table></body></html>`;
        const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Compras_${new Date().toISOString().split('T')[0]}.xls`; a.click();
    };
</script>
</body>
</html>
