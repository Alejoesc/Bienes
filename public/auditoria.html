<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>SGBN - Auditoría Institucional</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="toast-container" class="sgbn-toast-container"></div>
<button class="theme-toggle" onclick="toggleTheme()" title="Cambiar Tema"><span class="material-icons">dark_mode</span></button>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header"><div style="display:flex; align-items:center; gap:10px;"><span class="material-icons">inventory_2</span><h2 style="margin:0; font-size:20px;">SGBN</h2></div></div>
        <div class="sidebar-content">
            <div class="user-profile"><span class="material-icons">account_circle</span><div class="user-details"><span id="user-info" class="user-name"></span><span id="user-role" class="user-role-badge"></span></div></div>
            <nav class="sidebar-nav">
                <button onclick="navegarA('index.html')"><span class="material-icons">dashboard</span> Panel Gerencial</button>
                <button onclick="navegarA('inventario.html')"><span class="material-icons">devices</span> Inventario</button>
                <button onclick="navegarA('compras.html')"><span class="material-icons">shopping_cart</span> Compras</button>
                <button onclick="navegarA('licencias.html')"><span class="material-icons">vpn_key</span> Licencias</button>
                <button onclick="navegarA('contabilidad.html')" id="menu-contabilidad" class="hidden"><span class="material-icons">account_balance_wallet</span> Contabilidad</button>
                <button onclick="navegarA('enajenacion.html')"><span class="material-icons">delete_sweep</span> Enajenación</button>
                <button onclick="navegarA('usuarios.html')" id="menu-usuarios" class="hidden"><span class="material-icons">security</span> Usuarios</button>
                <button onclick="navegarA('departamentos.html')" id="menu-departamentos" class="hidden"><span class="material-icons">business</span> Departamentos</button>
                <button onclick="navegarA('auditoria.html')" id="menu-auditoria" class="hidden active"><span class="material-icons">policy</span> Auditoría</button>
                <button onclick="navegarA('sistema.html')" id="menu-sistema" class="hidden"><span class="material-icons">settings</span> Sistema</button>
            </nav>
            <div class="sidebar-footer"><button onclick="logout()" class="btn-danger" style="width:100%;"><span class="material-icons">logout</span> Salir</button></div>
        </div>
    </aside>
    <main class="main-content">
        <h1>Auditoría Institucional Avanzada</h1>
        <div class="audit-controls mt-3" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:15px; align-items:flex-end;">
            <div style="display:flex; gap:15px; align-items:flex-end; flex-wrap:wrap;">
                <div><label style="font-size:12px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:5px;">Desde:</label><div class="modern-date-picker"><input type="date" id="filtro-desde"></div></div>
                <div><label style="font-size:12px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:5px;">Hasta:</label><div class="modern-date-picker"><input type="date" id="filtro-hasta"></div></div>
                <button onclick="window.filtrarAuditoriaFechas()" class="btn-primary" style="height:44px;"><span class="material-icons">filter_list</span> Filtrar</button>
            </div>
            <div style="display:flex; gap:10px;">
                <button onclick="window.generarPDFAuditoriaRango()" class="btn-primary" style="height:44px; background:#e11d48;"><span class="material-icons">picture_as_pdf</span> Reporte Formal PDF</button>
            </div>
        </div>
        <div class="table-responsive mt-3">
            <table><thead><tr><th>Fecha / Hora</th><th>Usuario</th><th>IP / Disp.</th><th>Acción</th><th>Detalle</th></tr></thead><tbody id="tabla-auditoria"></tbody></table>
        </div>
    </main>
</div>
<script src="/js/app.js"></script>
<script>
    let cacheAuditoriaGlobal = [];

    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const res = await fetch('/api/auditoria', { headers: authHeaders() });
            cacheAuditoriaGlobal = await res.json();
            window.filtrarAuditoriaFechas();
        } catch(e) {}
    });

    window.filtrarAuditoriaFechas = function() {
        const desde = document.getElementById('filtro-desde').value;
        const hasta = document.getElementById('filtro-hasta').value;
        let filtrados = cacheAuditoriaGlobal;
        if(desde) filtrados = filtrados.filter(i => (i.created_at || i.fecha || '').split('T')[0] >= desde);
        if(hasta) filtrados = filtrados.filter(i => (i.created_at || i.fecha || '').split('T')[0] <= hasta);
        
        const tbody = document.getElementById('tabla-auditoria');
        tbody.innerHTML = filtrados.map(a => `
            <tr>
                <td>${a.created_at || a.fecha}</td>
                <td><strong>${a.usuario}</strong></td>
                <td><code>${a.ip}</code><br><small>${a.mac || 'PC'}</small></td>
                <td><span class="badge badge-primary">${a.accion}</span></td>
                <td>${a.detalle}</td>
            </tr>
        `).join('') || `<tr><td colspan="5" style="text-align:center;">No hay registros de auditoría.</td></tr>`;
    };

    window.generarPDFAuditoriaRango = async function() {
        const desde = document.getElementById('filtro-desde').value;
        const hasta = document.getElementById('filtro-hasta').value;
        let datos = cacheAuditoriaGlobal;
        if(desde) datos = datos.filter(i => (i.created_at || i.fecha || '').split('T')[0] >= desde);
        if(hasta) datos = datos.filter(i => (i.created_at || i.fecha || '').split('T')[0] <= hasta);

        if(datos.length === 0) return mostrarNotificacion("No hay registros en el rango.", "warning");
        await fetch('/api/auditoria/log', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ accion: 'REPORTE_PDF', detalle: 'Exportación de auditoría en PDF' }) });

        const win = window.open('', '_blank');
        const filas = datos.map(i => `<tr><td>${i.created_at||i.fecha}</td><td><strong>${i.usuario}</strong></td><td>${i.ip}</td><td><span class="badge">${i.accion}</span></td><td>${i.detalle}</td></tr>`).join('');
        
        win.document.write(`
            <!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Auditoría Oficial</title>
            <style>
                body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 40px; color: #333; font-size: 12px; }
                .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #1e3a8a; padding-bottom: 20px; margin-bottom: 30px; }
                .header-text { text-align: right; }
                .header-text h2 { margin: 0; color: #1e3a8a; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
                .header-text p { margin: 5px 0 0 0; color: #64748b; font-size: 13px; }
                .logo { font-size: 32px; font-weight: 800; color: #1e3a8a; border: 3px solid #1e3a8a; padding: 10px 15px; border-radius: 50%; display: inline-block; }
                .summary { background: #f8fafc; padding: 15px; border-left: 4px solid #3b82f6; margin-bottom: 25px; border-radius: 4px; }
                table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                th { background-color: #1e3a8a; color: white; padding: 12px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
                td { border-bottom: 1px solid #e2e8f0; padding: 10px 12px; }
                tr:nth-child(even) td { background-color: #f8fafc; }
                .badge { background: #e0e7ff; color: #3730a3; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
                @media print { button { display: none; } body { margin: 0; } }
            </style>
            </head><body>
                <div class="header">
                    <div class="logo">BCV</div>
                    <div class="header-text">
                        <h2>Reporte de Auditoría de Sistemas</h2>
                        <p>Plataforma Institucional SGBN</p>
                    </div>
                </div>
                <div class="summary">
                    <strong>Fecha de Emisión:</strong> ${new Date().toLocaleDateString('es-VE')}<br>
                    <strong>Total de Movimientos Registrados:</strong> ${datos.length} incidentes/acciones.
                </div>
                <table><thead><tr><th>Fecha / Hora</th><th>Usuario</th><th>IP Origen</th><th>Tipo de Acción</th><th>Detalles del Evento</th></tr></thead><tbody>${filas}</tbody></table>
                <script>window.onload=()=>window.print();<\/script>
            </body></html>
        `);
        win.document.close();
    };
</script>
</body>
</html>
