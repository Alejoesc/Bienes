<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>SGBN - Auditoría Institucional</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="toast-container" class="sgbn-toast-container"></div>
<button class="theme-toggle" onclick="toggleTheme()" title="Cambiar Tema"><span class="material-icons">dark_mode</span></button>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header"><div style="display:flex; align-items:center; gap:10px;"><span class="material-icons">inventory_2</span><h2 style="margin:0; font-size:20px;">SGBN</h2></div></div>
        <div class="sidebar-content">
            <div class="user-profile"><span class="material-icons">account_circle</span><div class="user-details"><span id="user-info" class="user-name"></span><span id="user-role" class="user-role-badge"></span></div></div>
            <nav class="sidebar-nav">
                <button onclick="navegarA('index.html')"><span class="material-icons">dashboard</span> Panel Gerencial</button>
                <button onclick="navegarA('inventario.html')"><span class="material-icons">devices</span> Inventario</button>
                <button onclick="navegarA('compras.html')"><span class="material-icons">shopping_cart</span> Compras</button>
                <button onclick="navegarA('licencias.html')"><span class="material-icons">vpn_key</span> Licencias</button>
                <button onclick="navegarA('contabilidad.html')" id="menu-contabilidad" class="hidden"><span class="material-icons">account_balance_wallet</span> Contabilidad</button>
                <button onclick="navegarA('enajenacion.html')"><span class="material-icons">delete_sweep</span> Enajenación</button>
                <button onclick="navegarA('usuarios.html')" id="menu-usuarios" class="hidden"><span class="material-icons">security</span> Usuarios</button>
                <button onclick="navegarA('departamentos.html')" id="menu-departamentos" class="hidden"><span class="material-icons">business</span> Departamentos</button>
                <button onclick="navegarA('auditoria.html')" id="menu-auditoria" class="hidden active"><span class="material-icons">policy</span> Auditoría</button>
                <button onclick="navegarA('sistema.html')" id="menu-sistema" class="hidden"><span class="material-icons">settings</span> Sistema</button>
            </nav>
            <div class="sidebar-footer"><button onclick="logout()" class="btn-danger" style="width:100%; justify-content:center;"><span class="material-icons">logout</span> Salir</button></div>
        </div>
    </aside>
    <main class="main-content">
        <h1>Auditoría Institucional Avanzada</h1>
        
        <div class="audit-controls mt-3" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:15px; align-items:flex-end;">
            <div style="display:flex; gap:15px; align-items:flex-end; flex-wrap:wrap;">
                <div>
                    <label style="font-size:12px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:5px;">Desde:</label>
                    <div class="modern-date-picker"><span class="material-icons">event</span><input type="date" id="filtro-desde"></div>
                </div>
                <div>
                    <label style="font-size:12px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:5px;">Hasta:</label>
                    <div class="modern-date-picker"><span class="material-icons">event</span><input type="date" id="filtro-hasta"></div>
                </div>
                <button onclick="filtrarAuditoriaFechas()" class="btn-primary" style="height:44px;"><span class="material-icons">filter_list</span> Filtrar</button>
            </div>
            <div style="display:flex; gap:10px;">
                <button onclick="generarPDFAuditoriaRango()" class="btn-primary" style="height:44px;"><span class="material-icons">picture_as_pdf</span> Exportar PDF</button>
                <button onclick="exportarExcelAuditoriaRango()" class="btn-primary" style="background:var(--success); height:44px;"><span class="material-icons">table_chart</span> Exportar Excel</button>
            </div>
        </div>

        <div class="table-responsive mt-3">
            <table>
                <thead><tr><th>Fecha / Hora</th><th>Usuario</th><th>IP / Disp.</th><th>Acción</th><th>Detalle</th></tr></thead>
                <tbody id="tabla-auditoria"></tbody>
            </table>
        </div>
    </main>
</div>
<script src="/js/app.js"></script>
<script src="/js/system.js"></script>
<script>
    let cacheAuditoriaGlobal = [];

    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const res = await fetch('/api/auditoria', { headers: authHeaders() });
            cacheAuditoriaGlobal = await res.json();
            renderAuditoriaTabla(cacheAuditoriaGlobal);
        } catch(e) {}
    });

    function renderAuditoriaTabla(data) {
        const tbody = document.getElementById('tabla-auditoria');
        if(!tbody) return;
        tbody.innerHTML = data.map(a => `
            <tr>
                <td>${a.created_at || a.fecha}</td>
                <td><strong>${a.usuario}</strong></td>
                <td><code>${a.ip}</code><br><small>${a.mac || 'PC'}</small></td>
                <td><span class="badge badge-primary">${a.accion}</span></td>
                <td>${a.detalle}</td>
            </tr>
        `).join('') || `<tr><td colspan="5" style="text-align:center;">No hay registros de auditoría.</td></tr>`;
    }

    function filtrarAuditoriaFechas() {
        const desde = document.getElementById('filtro-desde').value;
        const hasta = document.getElementById('filtro-hasta').value;
        let filtrados = cacheAuditoriaGlobal;
        if(desde) filtrados = filtrados.filter(i => (i.created_at || i.fecha || '').split('T')[0] >= desde);
        if(hasta) filtrados = filtrados.filter(i => (i.created_at || i.fecha || '').split('T')[0] <= hasta);
        renderAuditoriaTabla(filtrados);
    }

    function obtenerDatosFiltradosRango() {
        const desde = document.getElementById('filtro-desde').value;
        const hasta = document.getElementById('filtro-hasta').value;
        let filtrados = cacheAuditoriaGlobal;
        if(desde) filtrados = filtrados.filter(i => (i.created_at || i.fecha || '').split('T')[0] >= desde);
        if(hasta) filtrados = filtrados.filter(i => (i.created_at || i.fecha || '').split('T')[0] <= hasta);
        return filtrados;
    }

    async function generarPDFAuditoriaRango() {
        const datos = obtenerDatosFiltradosRango();
        if(datos.length === 0) return mostrarNotificacion("No hay registros en el rango seleccionado.", "warning");
        
        await fetch('/api/auditoria/log', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ accion: 'REPORTE_PDF', detalle: 'Exportación PDF de auditoría por rango' }) });

        const win = window.open('', '_blank');
        const filas = datos.map(i => `<tr><td>${i.created_at||i.fecha}</td><td>${i.usuario}</td><td>${i.ip}</td><td>${i.accion}</td><td>${i.detalle}</td></tr>`).join('');
        win.document.write(`
            <!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Reporte de Auditoría</title>
            <style>body{font-family:sans-serif;margin:25px;font-size:12px;} table{width:100%;border-collapse:collapse;margin-top:15px;} th,td{border:1px solid #ccc;padding:8px;text-align:left;} th{background:#f1f5f9;}</style>
            </head><body><h2>Reporte de Auditoría Institucional</h2><p><b>Registros:</b> ${datos.length}</p>
            <table><thead><tr><th>Fecha</th><th>Usuario</th><th>IP</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>${filas}</tbody></table>
            <script>window.onload=()=>window.print();<\/script></body></html>
        `);
        win.document.close();
    }

    async function exportarExcelAuditoriaRango() {
        const datos = obtenerDatosFiltradosRango();
        if(datos.length === 0) return mostrarNotificacion("No hay registros en el rango.", "warning");

        await fetch('/api/auditoria/log', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ accion: 'REPORTE_EXCEL', detalle: 'Exportación CSV de auditoría por rango' }) });

        let csv = "Fecha;Usuario;IP;Accion;Detalle\n";
        datos.forEach(i => csv += `${i.created_at || i.fecha};${i.usuario};${i.ip};${i.accion};${i.detalle}\n`);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        a.download = `auditoria_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
    }
</script>
</body>
</html>
