<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>SGBN - Sistema y Mantenimiento</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .file-upload-wrapper {
            border: 2px dashed var(--border); border-radius: 12px; padding: 25px;
            text-align: center; cursor: pointer; background: var(--bg-main); transition: all 0.2s ease; margin-bottom: 15px;
        }
        .file-upload-wrapper:hover { border-color: var(--primary); background: rgba(37, 99, 235, 0.03); }
        .format-box { background: var(--bg-main); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-top: 15px; font-size: 12px; color: var(--text-muted); }
        .format-box code { background: var(--table-header); padding: 2px 6px; border-radius: 4px; color: var(--primary); font-family: monospace; }
    </style>
</head>
<body>
<div id="toast-container" class="sgbn-toast-container"></div>
<button class="theme-toggle" onclick="toggleTheme()" title="Cambiar Tema"><span class="material-icons">dark_mode</span></button>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header"><div style="display:flex; align-items:center; gap:10px;"><span class="material-icons">inventory_2</span><h2 style="margin:0; font-size:20px;">SGBN</h2></div></div>
        <div class="sidebar-content">
            <div class="user-profile"><span class="material-icons">account_circle</span><div class="user-details"><span id="user-info" class="user-name"></span><span id="user-role" class="user-role-badge"></span></div></div>
            <nav class="sidebar-nav">
                <button onclick="navegarA('index.html')"><span class="material-icons">dashboard</span> Panel Gerencial</button>
                <button onclick="navegarA('inventario.html')"><span class="material-icons">devices</span> Inventario</button>
                <button onclick="navegarA('compras.html')"><span class="material-icons">shopping_cart</span> Compras</button>
                <button onclick="navegarA('licencias.html')"><span class="material-icons">vpn_key</span> Licencias</button>
                <button onclick="navegarA('contabilidad.html')" id="menu-contabilidad" class="hidden"><span class="material-icons">account_balance_wallet</span> Contabilidad</button>
                <button onclick="navegarA('enajenacion.html')"><span class="material-icons">delete_sweep</span> Enajenación</button>
                <button onclick="navegarA('usuarios.html')" id="menu-usuarios" class="hidden"><span class="material-icons">security</span> Usuarios</button>
                <button onclick="navegarA('departamentos.html')" id="menu-departamentos" class="hidden"><span class="material-icons">business</span> Departamentos</button>
                <button onclick="navegarA('auditoria.html')" id="menu-auditoria" class="hidden"><span class="material-icons">policy</span> Auditoría</button>
                <button onclick="navegarA('sistema.html')" id="menu-sistema" class="hidden active"><span class="material-icons">settings</span> Sistema</button>
            </nav>
            <div class="sidebar-footer"><button onclick="logout()" class="btn-danger" style="width:100%; justify-content:center;"><span class="material-icons">logout</span> Salir</button></div>
        </div>
    </aside>
    <main class="main-content">
        <h1>Mantenimiento y Respaldos del Sistema</h1>
        <div class="stats-grid mt-3">
            <div class="card-form" style="margin:0;">
                <h3 style="margin-bottom:15px; color:var(--primary);">Importar Inventario Excel</h3>
                
                <div class="file-upload-wrapper" onclick="document.getElementById('file-import').click()">
                    <span class="material-icons" style="font-size:36px; color:var(--primary);">cloud_upload</span>
                    <p id="file-name-display" style="font-size:13px; font-weight:600; margin-top:8px;">Haga clic para seleccionar archivo Excel (.xlsx)</p>
                </div>
                <input type="file" id="file-import" accept=".xlsx, .xls" style="display:none;" onchange="actualizarNombreArchivo(this)">

                <div class="format-box">
                    <b>Formato compatible (1ra Fila):</b><br>
                    <code>codigo</code> | <code>descripcion</code> | <code>serial</code> | <code>departamento</code> | <code>valor</code>
                </div>

                <button onclick="importarExcel()" class="btn-warning mt-3" style="width:100%; justify-content:center;">Procesar e Importar Datos</button>
            </div>
            
            <div class="card-form" style="margin:0;">
                <h3 style="margin-bottom:15px; color:var(--primary);">Exportaciones y Respaldos</h3>
                <button onclick="exportarExcel()" class="btn-primary mt-3" style="width:100%; justify-content:center;"><span class="material-icons">table_chart</span> Descargar Inventario (Excel)</button>
                <button onclick="descargarBackupSQL()" class="btn-primary mt-3" style="background:var(--success); width:100%; justify-content:center;"><span class="material-icons">storage</span> Respaldo Completo Base de Datos (SQL)</button>
            </div>
        </div>
    </main>
</div>
<script src="/js/app.js"></script>
<script src="/js/system.js"></script>
<script>
    function actualizarNombreArchivo(input) {
        const display = document.getElementById('file-name-display');
        if (input.files && input.files[0]) {
            display.innerText = "Archivo seleccionado: " + input.files[0].name;
            display.style.color = "var(--success)";
        }
    }
</script>
</body>
</html>
