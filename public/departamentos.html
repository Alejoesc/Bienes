<!DOCTYPE html>
<html lang="es" data-theme="light">
<head><meta charset="UTF-8"><title>SGBN - Departamentos</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div id="toast-container" class="sgbn-toast-container"></div>
<button class="theme-toggle" onclick="toggleTheme()"><span class="material-icons">dark_mode</span></button>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header"><div style="display:flex; align-items:center; gap:10px;"><span class="material-icons">inventory_2</span><h2 style="margin:0; font-size:20px;">SGBN</h2></div></div>
        <div class="sidebar-content">
            <div class="user-profile"><span class="material-icons">account_circle</span><div class="user-details"><span id="user-info" class="user-name"></span><span id="user-role" class="user-role-badge"></span></div></div>
            <nav class="sidebar-nav">
                <button onclick="navegarA('index.html')"><span class="material-icons">dashboard</span> Panel Gerencial</button>
                <button onclick="navegarA('inventario.html')"><span class="material-icons">devices</span> Inventario</button>
                <button onclick="navegarA('compras.html')"><span class="material-icons">shopping_cart</span> Compras</button>
                <button onclick="navegarA('licencias.html')"><span class="material-icons">vpn_key</span> Licencias</button>
                <button onclick="navegarA('contabilidad.html')" id="menu-contabilidad" class="hidden"><span class="material-icons">account_balance_wallet</span> Contabilidad</button>
                <button onclick="navegarA('enajenacion.html')"><span class="material-icons">delete_sweep</span> Enajenación</button>
                <button onclick="navegarA('usuarios.html')" id="menu-usuarios" class="hidden"><span class="material-icons">security</span> Usuarios</button>
                <button onclick="navegarA('departamentos.html')" id="menu-departamentos" class="hidden active"><span class="material-icons">business</span> Departamentos</button>
                <button onclick="navegarA('auditoria.html')" id="menu-auditoria" class="hidden"><span class="material-icons">policy</span> Auditoría</button>
                <button onclick="navegarA('sistema.html')" id="menu-sistema" class="hidden"><span class="material-icons">settings</span> Sistema</button>
            </nav>
            <div class="sidebar-footer"><button onclick="logout()" class="btn-danger" style="width:100%; justify-content:center;"><span class="material-icons">logout</span> Salir</button></div>
        </div>
    </aside>
    <main class="main-content">
        <h1>Gestión de Departamentos</h1>
        <div class="card-form mt-3"><div class="flex-between"><input type="text" id="d-nombre" placeholder="Nombre del Departamento" style="margin-bottom:0; max-width:400px;"><button onclick="addDepartamento()" class="btn-primary">Añadir</button></div></div>
        <div class="table-responsive mt-3"><table><thead><tr><th>ID</th><th>Nombre</th><th>Acciones</th></tr></thead><tbody id="tabla-dptos"></tbody></table></div>
    </main>
</div>
<script src="/js/app.js"></script><script src="/js/system.js"></script>
<script>document.addEventListener("DOMContentLoaded", () => { if(typeof loadDepartamentosList === 'function') loadDepartamentosList(); });</script>
</body>
</html>
